<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Portal • KhataPro</title><link rel="stylesheet" href="css/style.css"><style>
.mobile-only-form{display:block}.shop-pin-box{margin-top:14px;padding:18px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff06}.shop-pin-box input{width:100%;padding:13px;border-radius:11px;border:1px solid #ffffff20;background:#0b1725;color:inherit;outline:none;margin:8px 0 10px}.shop-pin-box button{width:100%}.shop-select-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.notif-top{position:sticky;top:0;z-index:10;margin:0 0 14px;padding:10px 14px;border-radius:14px;background:#0c1b2b;border:1px solid #ffffff16;display:flex;align-items:center;justify-content:space-between;gap:12px}.notif-bell{position:relative;border:0;background:transparent;color:inherit;font-size:24px;cursor:pointer}.notif-count{position:absolute;top:-5px;right:-8px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font:700 11px/19px Arial;text-align:center}.notif-show{border:0;border-radius:10px;padding:9px 12px;background:#1769e8;color:#fff;font-weight:800;cursor:pointer}.notif-panel{display:none;margin-bottom:14px}.notif-panel.open{display:block}.notif-item{padding:13px;border-bottom:1px solid #ffffff10}.notif-item:last-child{border-bottom:0}.notif-item.unread{background:#ffffff08}.notif-meta{font-size:12px;opacity:.65}.notif-type{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-right:7px}.notif-empty{padding:14px;opacity:.7}.payment-ok{color:#31d58a}.purchase-new{color:#53b7ff}
</style></head><body class="customer-bg"><header class="customer-nav"><a href="#" class="portal-brand"> My <span data-i18n="account"> Account</span></a><select id="languageSelect" class="lang"><option value="en">English</option><option value="ne">नेपाली</option></select></header><main class="wrap narrow"><section class="customer-hero"><div class="portal-icon">🔐</div><span class="portal-badge" data-i18n="secure">Private & secure access</span><h1 data-i18n="customerPortalTitle">Secure Customer Portal</h1><p class="hint" data-i18n="portalSubtitle">Enter your registered mobile number. We will show your connected shops first, then ask for the PIN of the selected shop.</p><form id="lookup" class="portal-form"><label><span data-i18n="mobile">Mobile number</span><input id="mobile" required inputmode="tel" autocomplete="tel" placeholder="98XXXXXXXX"></label><label style="display:none"><span data-i18n="pin">6-digit PIN</span><input id="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" placeholder="••••••"></label><button class="primary" type="submit" data-i18n="continue">Continue</button><p class="privacy">🔒 Mobile number alone does not reveal any shop, balance or account data.</p></form></section><section id="results" class="portal-result"></section><section id="view" class="hidden portal-result"></section></main><script type="module">
import {db,cleanMobile} from './js/firebase-config.js';
import {ref,get} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
import {initLanguage,t,money,esc} from './js/common.js';
initLanguage();
const form=document.querySelector('#lookup'),results=document.querySelector('#results'),view=document.querySelector('#view');
// Step 1 = mobile only. Step 2 = choose shop. Step 3 = PIN for the selected shop.
form.querySelector('#pin').closest('label').style.display='none';
const hashText=async text=>{const data=new TextEncoder().encode(text),hash=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')};
let currentMobile='';
function msgAccountNotFound(){return `<div class="result-error"><b>${t('accountNotFound')}</b><br>${t('checkDetails')}</div>`}
form.onsubmit=async e=>{
 e.preventDefault(); view.classList.add('hidden'); results.classList.remove('hidden');
 const mobile=cleanMobile(document.querySelector('#mobile').value); currentMobile=mobile;
 if(mobile.length<7){results.innerHTML=msgAccountNotFound();return}
 results.innerHTML=`<div class="panel">${t('checking')}</div>`;
 try{
   // Recommended index written by the owner software: customerAccessByMobile/{mobile}/shops/{uid}
   const idx=(await get(ref(db,`customerAccessByMobile/${mobile}`))).val();
   const shops=idx?.shops ? Object.entries(idx.shops).filter(([,x])=>x) : [];
   if(!shops.length){results.innerHTML=`<div class="result-error"><b>${t('accountNotFound')}</b><br>${t('checkDetails')}<br><small>Shop access index is not available for this mobile number.</small></div>`;return}
   results.innerHTML=`<div class="panel"><div class="shop-select-head"><div><h2>${t('selectShop')}</h2><p class="hint">Select your shop first. Then enter the 6-digit PIN for that shop.</p></div><button class="ghost" id="changeMobile" type="button">Change</button></div><div class="customer-grid">${shops.map(([uid,x])=>`<button class="customer-card" data-shop-uid="${esc(uid)}"><div class="avatar shop-photo-avatar">${x.shopPhoto?`<img src="${esc(x.shopPhoto)}" alt="${esc(x.shopName||t('shop'))}">`:'🏪'}</div><div><h3>${esc(x.shopName||t('shop'))}</h3><small>${esc(x.city||'')} ${esc(x.mobile||'')}</small></div><strong>›</strong></button>`).join('')}</div></div>`;
   document.querySelector('#changeMobile').onclick=()=>{results.classList.remove('hidden');view.classList.add('hidden');document.querySelector('#mobile').focus()};
   document.querySelectorAll('[data-shop-uid]').forEach(b=>b.onclick=()=>askShopPin(b.dataset.shopUid,shops.find(([uid])=>uid===b.dataset.shopUid)?.[1]||{}));
 }catch(err){console.error(err);results.innerHTML=`<div class="result-error">${t('error')}</div>`}
};
function askShopPin(uid,indexShop){
 const old=results.innerHTML;
 results.innerHTML=`<div class="panel"><button class="ghost" id="backShops" type="button">← ${t('back')}</button><div class="shop-pin-box"><div class="avatar shop-photo-avatar">${indexShop.shopPhoto?`<img src="${esc(indexShop.shopPhoto)}" alt="">`:'🏪'}</div><h2>${esc(indexShop.shopName||t('shop'))}</h2><p class="hint">Enter the private 6-digit PIN for this shop.</p><form id="shopPinForm"><input id="shopPin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" placeholder="••••••" required><button class="primary" type="submit">Continue</button><div id="pinError"></div></form></div></div>`;
 document.querySelector('#backShops').onclick=()=>{results.innerHTML=old;document.querySelectorAll('[data-shop-uid]').forEach(b=>b.onclick=()=>askShopPin(b.dataset.shopUid,{}));};
 document.querySelector('#shopPinForm').onsubmit=async e=>{e.preventDefault();const pin=document.querySelector('#shopPin').value.trim();const err=document.querySelector('#pinError');if(!/^[0-9]{6}$/.test(pin)){err.innerHTML=`<div class="result-error">PIN must be 6 digits.</div>`;return}err.innerHTML=`<div class="panel">${t('checking')}</div>`;try{const key=await hashText(currentMobile+'|'+pin);const data=(await get(ref(db,`customerAccess/${key}`))).val();if(!data||data.enabled!==true||!data.shops?.[uid]||cleanMobile(data.shops[uid]?.account?.mobile)!==currentMobile){err.innerHTML=`<div class="result-error"><b>${t('accountNotFound')}</b><br>Wrong PIN for this shop.</div>`;return}showAccount(uid,data.shops[uid],currentMobile)}catch(ex){console.error(ex);err.innerHTML=`<div class="result-error">${t('error')}</div>`}};
}
function makeNotifications(shopData,customer){
 const list=[];
 Object.entries(shopData.notifications||{}).forEach(([id,n])=>list.push({id:'n:'+id,title:n.title||t('notification'),message:n.message||'',createdAt:n.createdAt||0,type:'notice'}));
 Object.entries(customer?.transactions||{}).forEach(([id,x])=>{const ts=x.createdAt||0;if(x.type==='credit'){list.push({id:'p:'+id,title:'New item purchased',message:`${x.item||'Item'} • Qty ${Number(x.qty)||1} • ${money(x.amount||0)}`,createdAt:ts,type:'purchase'});}else{list.push({id:'pay:'+id,title:'Payment complete',message:`Payment received • ${money(x.amount||0)}`,createdAt:ts,type:'payment'});}});
 return list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
function formatDateTime(ts,date){const d=ts?new Date(ts):new Date((date||new Date().toISOString().slice(0,10))+'T00:00:00');return d.toLocaleString(localStorage.getItem('khata_lang')==='ne'?'ne-NP':'en-IN',{dateStyle:'short',timeStyle:'short',hour12:true})}
function showAccount(uid,shopData,mobile){results.classList.add('hidden');view.classList.remove('hidden');const customer=shopData?.account;if(!customer||cleanMobile(customer.mobile)!==mobile){view.innerHTML=`<div class="result-error"><b>${t('accountNotFound')}</b></div>`;return}let total=0,paid=0,rows='';Object.values(customer.transactions||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(x=>{if(x.type==='credit')total+=Number(x.amount)||0;else paid+=Number(x.amount)||0;const qty=Number(x.qty)||1;const mrp=x.type==='credit'?(Number(x.amount)||0)/qty:0;rows+=`<tr><td>${esc(formatDateTime(x.createdAt,x.date))}</td><td>${esc(x.item||t('payment'))}</td><td>${x.type==='credit'?money(mrp):'—'}</td><td>${x.type==='credit'?esc(qty):'—'}</td><td class="${x.type==='credit'?'credit':'paid'}">${x.type==='credit'?money(x.amount):'-'+money(x.amount)}</td></tr>`});
 const notes=makeNotifications(shopData,customer);const seenKey=`khata_notifications_${uid}_${mobile}`;const seen=JSON.parse(localStorage.getItem(seenKey)||'[]');const unread=notes.filter(n=>!seen.includes(n.id));
 const noteItems=notes.map(n=>`<div class="notif-item ${seen.includes(n.id)?'':'unread'}"><div><span class="notif-type ${n.type==='payment'?'payment-ok':n.type==='purchase'?'purchase-new':''}">${n.type==='payment'?'PAYMENT COMPLETE':n.type==='purchase'?'NEW PURCHASE':'NOTICE'}</span><strong>${esc(n.title)}</strong></div><div>${esc(n.message)}</div><div class="notif-meta">${esc(formatDateTime(n.createdAt,''))}</div></div>`).join('')||`<div class="notif-empty">No notifications</div>`;
 view.innerHTML=`<button class="ghost back" id="back">← ${t('back')}</button><div class="notif-top"><button class="notif-bell" id="bell" type="button" aria-label="Notifications">🔔<span class="notif-count" id="notifCount">${unread.length}</span></button><strong>Notifications</strong><button class="notif-show" id="showNow" type="button">Show Now</button></div><div class="notif-panel" id="notifPanel"><section class="panel">${noteItems}</section></div><section class="panel account-box"><p class="eyebrow">${t('account')}</p><div class="account-top"><div class="portal-shop-head"><div class="portal-shop-photo">${shopData.shopPhoto?`<img src="${esc(shopData.shopPhoto)}" alt="${esc(shopData.shopName||t('shop'))}">`:'🏪'}</div><div><h1>${esc(shopData.shopName||t('shop'))}</h1><p>${esc(customer.name||'')} • ${esc(customer.mobile||'')}</p></div></div><span class="portal-badge">${t('balance')}: ${money(total-paid)}</span></div><div class="stats"><div class="stat"><small>${t('totalCredit')}</small><strong>${money(total)}</strong></div><div class="stat"><small>${t('totalPaid')}</small><strong class="green">${money(paid)}</strong></div><div class="stat"><small>${t('remaining')}</small><strong class="red">${money(total-paid)}</strong></div></div><h2>${t('history')}</h2><div class="tablewrap transaction-table"><table><thead><tr><th>${t('dateTime')}</th><th>${t('item')}</th><th>${t('mrp')}</th><th>${t('quantity')}</th><th>${t('total')}</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">${t('noTransactions')}</td></tr>`}</tbody></table></div></section><section><h2 style="margin-top:22px">🔔 ${t('notifications')}</h2><div class="panel">${noteItems}</div></section>`;
 document.querySelector('#back').onclick=()=>{view.classList.add('hidden');results.classList.remove('hidden')};
 const panel=document.querySelector('#notifPanel');document.querySelector('#bell').onclick=()=>panel.classList.toggle('open');document.querySelector('#showNow').onclick=()=>{panel.classList.add('open');localStorage.setItem(seenKey,JSON.stringify(notes.map(n=>n.id)));const c=document.querySelector('#notifCount');c.textContent='0';c.style.display='none'};
 if(unread.length){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.035;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.12)}catch(e){}}
}
window.addEventListener('languageChanged',()=>location.reload());
</script></body></html>
