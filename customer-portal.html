<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Portal • KhataPro</title>
<link rel="stylesheet" href="css/style.css">
<style>
.step{display:none}.step.active{display:block}.shop-list{display:grid;gap:10px;margin-top:15px}.shop-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #dbe4f4;border-radius:16px;background:#fff;text-align:left;cursor:pointer}.shop-btn:hover{border-color:#536dfe;background:#f7f9ff}.shop-avatar{width:48px;height:48px;border-radius:14px;overflow:hidden;background:#eef2ff;display:grid;place-items:center;font-size:24px;flex:none}.shop-avatar img{width:100%;height:100%;object-fit:cover}.shop-info{flex:1}.shop-info strong{display:block;font-size:16px}.shop-info small{color:#728096}.arrow{font-size:25px;color:#536dfe}.top-notify{position:relative;display:flex;justify-content:flex-end;margin-bottom:10px}.bell{border:0;background:#fff;border-radius:14px;padding:10px 13px;box-shadow:0 5px 18px #0001;cursor:pointer;font-size:19px}.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;margin-left:5px}.toast-list{display:grid;gap:9px;margin-top:10px}.toast{background:#fff;border:1px solid #e4eaf5;border-radius:14px;padding:13px}.toast.new{border-color:#536dfe}.toast-title{font-weight:800}.toast small{color:#7b8798}.pin-box{margin-top:15px}.back-btn{margin-top:10px}.success{background:#ecfdf3;border:1px solid #bbf7d0;color:#166534;padding:12px;border-radius:12px}.error-detail{font-size:13px;margin-top:6px;color:#9f1239}.hidden{display:none!important}
</style>
</head>
<body class="customer-bg">
<header class="customer-nav">
<a href="#" class="portal-brand">My <span data-i18n="account">Account</span></a>
<select id="languageSelect" class="lang"><option value="en">English</option><option value="ne">नेपाली</option></select>
</header>
<main class="wrap narrow">
<section class="customer-hero">
<div class="portal-icon">🔐</div>
<span class="portal-badge">Private & secure access</span>
<h1>Secure Customer Portal</h1>
<p class="hint" id="subtitle">Enter your registered mobile number. Then select your shop and enter that shop's 6-digit PIN.</p>

<div id="stepMobile" class="step active">
<form id="mobileForm" class="portal-form">
<label>Mobile number<input id="mobile" required inputmode="tel" autocomplete="tel" placeholder="98XXXXXXXX"></label>
<button class="primary" type="submit">Continue</button>
<p class="privacy">🔒 Mobile number alone does not show balance or account details.</p>
</form>
</div>

<div id="stepShop" class="step">
<div id="shopStatus" class="panel">Finding your shops…</div>
<div id="shopList" class="shop-list"></div>
<button id="backMobile" class="ghost back-btn" type="button">← Change mobile number</button>
</div>

<div id="stepPin" class="step">
<div id="selectedShop" class="panel"></div>
<form id="pinForm" class="portal-form pin-box">
<label>6-digit PIN<input id="pin" required inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" placeholder="••••••"></label>
<button class="primary" type="submit">Continue</button>
</form>
<button id="backShop" class="ghost back-btn" type="button">← Select another shop</button>
</div>
</section>

<section id="results" class="portal-result"></section>
<section id="view" class="hidden portal-result"></section>
</main>
<script type="module">
import {db,cleanMobile} from './js/firebase-config.js';
import {ref,get} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
import {initLanguage,t,money,esc} from './js/common.js';
initLanguage();

const $=s=>document.querySelector(s);
const mobileForm=$('#mobileForm'),pinForm=$('#pinForm');
const stepMobile=$('#stepMobile'),stepShop=$('#stepShop'),stepPin=$('#stepPin');
const shopStatus=$('#shopStatus'),shopList=$('#shopList'),results=$('#results'),view=$('#view');
let mobile='', selectedUid='', selectedShop=null, selectedIndex=null;

const hashText=async text=>{const data=new TextEncoder().encode(text),hash=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')};
const showStep=s=>{[stepMobile,stepShop,stepPin].forEach(x=>x.classList.remove('active'));s.classList.add('active');results.innerHTML='';};
const fail=(title,detail='')=>{results.innerHTML=`<div class="result-error"><b>${esc(title)}</b>${detail?`<div class="error-detail">${esc(detail)}</div>`:''}</div>`};

mobileForm.onsubmit=async e=>{
 e.preventDefault();
 mobile=cleanMobile($('#mobile').value);
 if(mobile.length<7){fail('Please enter a valid mobile number.');return;}
 showStep(stepShop);shopStatus.textContent='Finding your shops…';shopList.innerHTML='';
 try{
   // This index is written by the owner software when a customer is saved/updated.
   let index=(await get(ref(db,`customerAccessByMobile/${mobile}`))).val();
   if(!index){
     // Accept an alternate index name for compatibility with earlier KhataPro builds.
     index=(await get(ref(db,`customerIndex/${mobile}`))).val();
   }
   if(!index){shopStatus.innerHTML='<b>No shop found for this mobile number.</b><br><small>The owner software must register this mobile in the customer index.</small>';return;}
   const shops=index.shops||index;
   const entries=Object.entries(shops).filter(([,x])=>x&&typeof x==='object');
   if(!entries.length){shopStatus.textContent='No shop is linked to this mobile number.';return;}
   shopStatus.innerHTML='<b>Select your shop</b><br><small>PIN will be requested after you select the shop.</small>';
   shopList.innerHTML=entries.map(([uid,x])=>`<button type="button" class="shop-btn" data-uid="${esc(uid)}"><span class="shop-avatar">${x.shopPhoto?`<img src="${esc(x.shopPhoto)}" alt="">`:'🏪'}</span><span class="shop-info"><strong>${esc(x.shopName||x.name||'Shop')}</strong><small>${esc(x.address||'Customer account')}</small></span><span class="arrow">›</span></button>`).join('');
   document.querySelectorAll('.shop-btn').forEach(b=>b.onclick=()=>chooseShop(b.dataset.uid,shops[b.dataset.uid]));
 }catch(err){
   console.error(err);
   shopStatus.innerHTML='<b>Unable to load shops.</b><br><small>Check Firebase Realtime Database rules and the customer mobile index.</small>';
 }
};

function chooseShop(uid,shop){selectedUid=uid;selectedShop=shop;selectedIndex=shop;showStep(stepPin);$('#selectedShop').innerHTML=`<div style="display:flex;align-items:center;gap:12px"><div class="shop-avatar">${shop?.shopPhoto?`<img src="${esc(shop.shopPhoto)}" alt="">`:'🏪'}</div><div><b>${esc(shop?.shopName||shop?.name||'Shop')}</b><br><small>Enter this shop's 6-digit PIN</small></div></div>`;$('#pin').focus();}

pinForm.onsubmit=async e=>{
 e.preventDefault();
 const pin=$('#pin').value.trim();
 if(!/^\d{6}$/.test(pin)){fail('Enter a valid 6-digit PIN.');return;}
 results.innerHTML='<div class="panel">Checking PIN…</div>';
 try{
   const key=await hashText(mobile+'|'+pin);
   const data=(await get(ref(db,`customerAccess/${key}`))).val();
   if(!data||data.enabled!==true){fail('Incorrect PIN.','Please enter the PIN for the selected shop.');return;}
   const shopData=data.shops?.[selectedUid];
   if(!shopData){fail('This PIN is not registered for the selected shop.');return;}
   showAccount(selectedUid,shopData,mobile);
 }catch(err){console.error(err);fail('Something went wrong.','Firebase access was denied or the database is unavailable.');}
};

$('#backMobile').onclick=()=>{mobileForm.reset();showStep(stepMobile)};
$('#backShop').onclick=()=>showStep(stepShop);

function showAccount(uid,shopData,mobile){
 results.classList.add('hidden');view.classList.remove('hidden');
 const customer=shopData?.account;
 if(!customer||cleanMobile(customer.mobile)!==mobile){view.innerHTML='<div class="result-error"><b>Account not found.</b></div>';return;}
 let total=0,paid=0,rows='';
 Object.values(customer.transactions||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(x=>{if(x.type==='credit')total+=Number(x.amount)||0;else paid+=Number(x.amount)||0;const qty=Number(x.qty)||1;const mrp=x.type==='credit'?(Number(x.amount)||0)/qty:0;rows+=`<tr><td>${esc(formatDateTime(x.createdAt,x.date))}</td><td>${esc(x.item||'Payment')}</td><td>${x.type==='credit'?money(mrp):'—'}</td><td>${x.type==='credit'?esc(qty):'—'}</td><td class="${x.type==='credit'?'credit':'paid'}">${x.type==='credit'?money(x.amount):'-'+money(x.amount)}</td></tr>`});
 const notes=Object.entries(shopData.notifications||{}).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
 const unread=notes.filter(([,n])=>n.read!==true).length;
 const noteHtml=notes.length?notes.map(([id,n])=>{const type=(n.type||n.kind||'').toLowerCase();const title=type.includes('payment')?'PAYMENT COMPLETE':type.includes('purchase')||type.includes('credit')?'NEW PURCHASE':(n.title||'Notification');return `<div class="toast ${n.read===true?'':'new'}"><div class="toast-title">🔔 ${esc(title)}</div><small>${esc(formatDateTime(n.createdAt,''))}</small><p>${esc(n.message||'')}</p></div>`}).join(''):'<div class="empty">No notifications</div>';
 view.innerHTML=`<div class="top-notify"><button class="bell" id="bell">🔔 <span class="count" id="notifyCount">${unread}</span></button></div><section class="panel account-box"><button class="ghost" id="backAccount">← Back</button><p class="eyebrow">Account</p><div class="account-top"><div class="portal-shop-head"><div class="portal-shop-photo">${shopData.shopPhoto?`<img src="${esc(shopData.shopPhoto)}" alt="">`:'🏪'}</div><div><h1>${esc(shopData.shopName||'Shop')}</h1><p>${esc(customer.name||'')} • ${esc(customer.mobile||'')}</p></div></div><span class="portal-badge">Balance: ${money(total-paid)}</span></div><div class="stats"><div class="stat"><small>Total Credit</small><strong>${money(total)}</strong></div><div class="stat"><small>Total Paid</small><strong class="green">${money(paid)}</strong></div><div class="stat"><small>Remaining</small><strong class="red">${money(total-paid)}</strong></div></div><h2>Transaction History</h2><div class="tablewrap transaction-table"><table><thead><tr><th>Date & Time</th><th>Item</th><th>MRP</th><th>Qty</th><th>Total</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">No transactions</td></tr>'}</tbody></table></div></section><section id="notificationPanel" class="hidden"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2>🔔 Notifications</h2><button class="primary" id="showNow" type="button">Show Now</button></div><div class="toast-list">${noteHtml}</div></section>`;
 $('#backAccount').onclick=()=>{view.classList.add('hidden');results.classList.remove('hidden');showStep(stepShop)};
 $('#bell').onclick=()=>{$('#notificationPanel').classList.toggle('hidden');};
 $('#showNow').onclick=()=>{$('#notificationPanel').classList.remove('hidden');$('#notificationPanel').scrollIntoView({behavior:'smooth',block:'start'});};
 if(unread){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.035;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.12)}catch(e){}}
}
function formatDateTime(ts,date){const d=ts?new Date(ts):new Date((date||new Date().toISOString().slice(0,10))+'T00:00:00');return d.toLocaleString(localStorage.getItem('khata_lang')==='ne'?'ne-NP':'en-IN',{dateStyle:'short',timeStyle:'short',hour12:true})}
window.addEventListener('languageChanged',()=>location.reload());
</script>
</body>
</html>
